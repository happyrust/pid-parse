[package]
name = "pid-parse"
version = "0.11.7"
edition = "2021"
# The oldest toolchain this crate is checked against (`cargo +1.95 check`
# is green on 2026-09-20). Declared so clippy's MSRV-aware lints stop
# proposing std APIs the stable toolchains do not have -- the nightly of
# 2026-09-18 wanted every `.map(f).unwrap_or_default()` turned into
# `Option::map_or_default`, which is still unstable on 1.95 / 1.97.
rust-version = "1.95"
description = "Layered parser for SmartPlant / Smart P&ID .pid files"
license = "MIT OR Apache-2.0"

[dependencies]
base64 = "0.22"
cfb = "0.14"
quick-xml = { version = "0.39", features = ["serialize"] }
# rusqlite with the `bundled` feature compiles a vendored sqlite3.
# Publish XML keeps this as an in-memory relational adapter while
# the primary plant source is now Rust MDF parsing via oxidized-mdf.
# Both ride the `backup` feature (on by default): they are the plant
# database side of the crate, not the `.pid` reader, and a wasm32
# consumer cannot build the vendored sqlite3.
rusqlite = { version = "0.39", features = ["bundled"], optional = true }
oxidized-mdf = { path = "vendor/oxidized-mdf", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
encoding_rs = "0.8"
log = "0.4"
env_logger = "0.11"
schemars = { version = "1.2.1", features = ["preserve_order"] }
uuid = { version = "1", features = ["serde", "v5"] }
# `zip` is gated to the central-directory reader only — we list
# `RefData~SCHEMA~ID(.zip)?` entry metadata, never decompressing
# payload bytes ourselves. We still need `deflate` enabled because
# `ZipArchive::by_index` constructs a decoder for each entry up
# front (the `zip` crate only validates compression-method support
# when the entry is opened, not when bytes are read), and every
# `SmartPlant`-produced archive observed in the wild uses the
# stored / deflate methods. The other heavy default features
# (aes-crypto / bzip2 / xz / lzma / zstd) stay off to keep the
# CVE surface and build time small.
zip = { version = "8", default-features = false, features = ["deflate"], optional = true }
sha2 = { version = "0.11.0", optional = true }

[features]
default = ["backup"]
# The SmartPlant plant-database side: the SQL Server backup / MDF readers
# (`backup`), the publish pipeline that builds `_Data.xml` / `_Meta.xml`
# from them (`publish`) and the export-bundle driver over both
# (`export_bundle`), with the binaries that front them. Off, the crate is
# the `.pid` reader alone -- no vendored sqlite3, no MDF reader -- which is
# what a wasm32 consumer (OpenCADStudio's web build) can compile; see OCS
# plan `2026-09-28-pid-import-next-steps.md` W0.
backup = ["dep:rusqlite", "dep:oxidized-mdf", "dep:zip", "dep:sha2"]

# The binaries, example and bench that read the plant database or publish
# from it only build with the feature they need; the `.pid`-only binaries
# stay auto-discovered.
[[bin]]
name = "pid_backup_extract"
required-features = ["backup"]

[[bin]]
name = "pid_backup_probe"
required-features = ["backup"]

[[bin]]
name = "pid_inspect"
required-features = ["backup"]

[[bin]]
name = "pid_msda_probe"
required-features = ["backup"]

[[bin]]
name = "pid_publish_xml"
required-features = ["backup"]

[[example]]
name = "publish_walkthrough"
required-features = ["backup"]

[dev-dependencies]
pretty_assertions = "1"
# Benchmarks live in `benches/` and gate themselves on the local
# `test-file/` fixture; see `benches/pid_pipeline.rs`. Keep criterion
# `default-features = false` so benches compile on a plain stable
# toolchain (no plotters, no rayon surprise) and stay fast to build.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "pid_pipeline"
harness = false
required-features = ["backup"]
