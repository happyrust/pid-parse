[package]
name = "pid-parse"
version = "0.11.7"
edition = "2021"
# The oldest toolchain this crate is checked against (`cargo +1.95 check`
# is green on 2026-09-20). Declared so clippy's MSRV-aware lints stop
# proposing std APIs the stable toolchains do not have -- the nightly of
# 2026-09-18 wanted every `.map(f).unwrap_or_default()` turned into
# `Option::map_or_default`, which is still unstable on 1.95 / 1.97.
rust-version = "1.95"
description = "Layered parser for SmartPlant / Smart P&ID .pid files"
license = "MIT OR Apache-2.0"

[dependencies]
base64 = "0.22"
cfb = "0.14"
# The `SystemTime` a CFB directory entry reports is `cfb`'s, which is
# `web_time::SystemTime` -- `std::time::SystemTime` re-exported on native,
# a distinct type on wasm32 -- so the storage timestamps this crate reads,
# keeps and writes back are typed the same way; otherwise the wasm32 build
# stops on the six comparisons in `cfb/reader.rs` and `writer/cfb_write.rs`
# (OCS plan 2026-09-28-pid-import-next-steps W0 / W1).
web-time = { version = "1.1", features = ["serde"] }
quick-xml = { version = "0.39", features = ["serialize"] }
# rusqlite with the `bundled` feature compiles a vendored sqlite3.
# Publish XML keeps this as an in-memory relational adapter while
# the primary plant source is now Rust MDF parsing via oxidized-mdf.
# Both ride the `backup` feature (on by default): they are the plant
# database side of the crate, not the `.pid` reader, and a wasm32
# consumer cannot build the vendored sqlite3.
rusqlite = { version = "0.39", features = ["bundled"], optional = true }
oxidized-mdf = { path = "vendor/oxidized-mdf", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
encoding_rs = "0.8"
# Only the publish pipeline logs, and only `pid_publish_xml` initialises a
# logger; both ride `backup`.
log = { version = "0.4", optional = true }
env_logger = { version = "0.11", optional = true }
schemars = { version = "1.2.1", features = ["preserve_order"] }
uuid = { version = "1", features = ["serde", "v5"] }
# `zip` reads the archives of a plant backup: `backup::zip_index`
# lists `RefData~SCHEMA~ID(.zip)?` / `PlantData~2~*.zip` entry metadata
# and `backup::store` reads the `<Plant>_p.zip` and every Option
# Archive in it entry by entry for the Backup Store's file list
# (SHA-256 per entry, optional embedded bytes). `deflate` is the one
# compression method needed: every `SmartPlant`-produced archive
# observed so far uses the stored / deflate methods. The other heavy
# default features (aes-crypto / bzip2 / xz / lzma / zstd) stay off to
# keep the CVE surface and build time small.
zip = { version = "8", default-features = false, features = ["deflate"], optional = true }
sha2 = { version = "0.11.0", optional = true }

[features]
default = ["backup"]
# The SmartPlant plant-database side: the SQL Server backup / MDF readers
# (`backup`), the publish pipeline that builds `_Data.xml` / `_Meta.xml`
# from them (`publish`) and the export-bundle driver over both
# (`export_bundle`), with the binaries that front them. Off, the crate is
# the `.pid` reader alone -- no vendored sqlite3, no MDF reader -- which is
# what a wasm32 consumer (OpenCADStudio's web build) can compile; see OCS
# plan `2026-09-28-pid-import-next-steps.md` W0.
backup = ["dep:rusqlite", "dep:oxidized-mdf", "dep:zip", "dep:sha2", "dep:log", "dep:env_logger"]

# The binaries, example and bench that read the plant database or publish
# from it only build with the feature they need; the `.pid`-only binaries
# stay auto-discovered.
[[bin]]
name = "pid_backup_extract"
required-features = ["backup"]

[[bin]]
name = "pid_backup_probe"
required-features = ["backup"]

[[bin]]
name = "pid_inspect"
required-features = ["backup"]

[[bin]]
name = "pid_msda_probe"
required-features = ["backup"]

[[bin]]
name = "pid_publish_xml"
required-features = ["backup"]

[[bin]]
name = "pid_backup_store"
required-features = ["backup"]

[[example]]
name = "publish_walkthrough"
required-features = ["backup"]

[[example]]
name = "oracle_exp_schema"
required-features = ["backup"]

# The integration tests that read the plant database, publish from it or
# drive a binary that does; `cargo test --no-default-features` builds the
# `.pid`-only tests and skips these.
[[test]]
name = "backup_boot_page"
required-features = ["backup"]

[[test]]
name = "backup_manifest_real_file"
required-features = ["backup"]

[[test]]
name = "backup_msci"
required-features = ["backup"]

[[test]]
name = "backup_mdf_reader_test02"
required-features = ["backup"]

[[test]]
name = "backup_mtf"
required-features = ["backup"]

[[test]]
name = "backup_refdata_real_dir"
required-features = ["backup"]

[[test]]
name = "backup_store_cli"
required-features = ["backup"]

[[test]]
name = "backup_store_dwg"
required-features = ["backup"]

[[test]]
name = "backup_store_sqplant"
required-features = ["backup"]

[[test]]
name = "backup_store_test02"
required-features = ["backup"]

[[test]]
name = "backup_syscatalog"
required-features = ["backup"]

[[test]]
name = "backup_zip_index_real_files"
required-features = ["backup"]

[[test]]
name = "inspect_cli"
required-features = ["backup"]

[[test]]
name = "publish_a01_raw_residual"
required-features = ["backup"]

[[test]]
name = "publish_attribute_parity"
required-features = ["backup"]

[[test]]
name = "publish_backlog_inventory"
required-features = ["backup"]

[[test]]
name = "publish_dwg_generated_parity"
required-features = ["backup"]

[[test]]
name = "publish_dwg_mirror"
required-features = ["backup"]

[[test]]
name = "publish_interface_parity"
required-features = ["backup"]

[[test]]
name = "publish_mdf_load"
required-features = ["backup"]

[[test]]
name = "publish_meta_parity"
required-features = ["backup"]

[[test]]
name = "publish_rel_parity"
required-features = ["backup"]

[[test]]
name = "publish_sqlite_load"
required-features = ["backup"]

[[test]]
name = "publish_store_parity"
required-features = ["backup"]

[[test]]
name = "publish_writer_coverage"
required-features = ["backup"]

[[test]]
name = "publish_xml_cli"
required-features = ["backup"]

[dev-dependencies]
pretty_assertions = "1"
# `backup_mdf_reader_test02` looks at the milliseconds of the `datetime`
# values the vendored MDF reader hands out (`chrono::DateTime`); same crate
# and version the reader already pulls in.
chrono = "0.4"
# Benchmarks live in `benches/` and gate themselves on the local
# `test-file/` fixture; see `benches/pid_pipeline.rs`. Keep criterion
# `default-features = false` so benches compile on a plain stable
# toolchain (no plotters, no rayon surprise) and stay fast to build.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "pid_pipeline"
harness = false
required-features = ["backup"]
